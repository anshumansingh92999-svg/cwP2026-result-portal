CWP 2026 • ONLINE PORTAL V2

<script>
const KEY='cwp2026_local_records_v2';

const SUPABASE_URL = 'https://tddvbinqcyzlixuyrngt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_V6Z_HxdJsZNn_zI5lmPJxQ_lkZx9h3U';
const ADMIN_EMAIL = 'admin@cwp2026.local';

const CWP_ONLINE = {
  version: '3.0',
  async request(path, options={}) {
    const headers = Object.assign({
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json'
    }, options.headers || {});
    const r = await fetch(SUPABASE_URL + path, Object.assign({}, options, {headers}));
    if (!r.ok) {
      let detail = '';
      try { detail = await r.text(); } catch (_) {}
      throw new Error(detail || 'Supabase request failed.');
    }
    return r.status === 204 ? null : await r.json();
  },
  async getResult(studentId, paperCode) {
    const data = await this.request('/rest/v1/rpc/get_cwp_result', {
      method: 'POST',
      body: JSON.stringify({p_student_id: studentId, p_paper_code: paperCode})
    });
    return data || null;
  },
  async listResults(token) {
    return await this.request('/rest/v1/cwp_results?select=*' +
      '&order=created_at.desc', {
      headers: {'Authorization': 'Bearer ' + token}
    });
  },
  async upsertResult(record, token) {
    return await this.request('/rest/v1/cwp_results?on_conflict=student_id,paper_code', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Prefer': 'resolution=merge-duplicates,return=representation'
      },
      body: JSON.stringify(record)
    });
  },
  async deleteResult(studentId, paperCode, token) {
    await this.request('/rest/v1/cwp_results?student_id=eq.' +
      encodeURIComponent(studentId) + '&paper_code=eq.' +
      encodeURIComponent(paperCode), {
      method: 'DELETE',
      headers: {'Authorization': 'Bearer ' + token}
    });
  }
};

let currentAdminToken = null;
let onlineRecords = [];

const demo={
 student_id:'CWP26-MID-014',student_name:'Aditi Singh',class:'6',set:'A',paper_code:'6MA01A',
 subject:'Mathematics',chapter:'Chapter 1',test:'Test 1',date:'16/09/2026',shift:'3',
 maximum_marks:100,
 question_marks:[['Q1',5,5],['Q2',5,4],['Q3',5,5],['Q4',10,8],['Q5',10,9],['Q6',15,13],['Q7',20,18],['Q8',30,25]],
 remarks:'Good understanding of the chapter. Review the steps in Q4 and Q8.',answer_sheets:[{page:1,type:'image/svg+xml',data:'data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22900%22%20height%3D%221200%22%3E%3Crect%20width%3D%22900%22%20height%3D%221200%22%20fill%3D%22white%22/%3E%3Crect%20x%3D%2230%22%20y%3D%2230%22%20width%3D%22840%22%20height%3D%221140%22%20rx%3D%2214%22%20fill%3D%22none%22%20stroke%3D%22%230b2d4d%22%20stroke-width%3D%224%22/%3E%3Ctext%20x%3D%2260%22%20y%3D%2290%22%20font-family%3D%22Arial%22%20font-size%3D%2230%22%20font-weight%3D%22700%22%20fill%3D%22%230b2d4d%22%3ECHILDREN%20WELFARE%20PROGRAMME%202026%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22130%22%20font-family%3D%22Arial%22%20font-size%3D%2221%22%20fill%3D%22%23526579%22%3EMATHEMATICS%20%E2%80%94%20CHAPTER%201%20%E2%80%94%20TEST%201%3C/text%3E%3Cline%20x1%3D%2260%22%20y1%3D%22160%22%20x2%3D%22840%22%20y2%3D%22160%22%20stroke%3D%22%23d7e1e9%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2260%22%20y%3D%22210%22%20font-family%3D%22Arial%22%20font-size%3D%2220%22%20font-weight%3D%22700%22%3EStudent%3A%20Aditi%20Singh%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22245%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3EStudent%20ID%3A%20CWP26-MID-014%3C/text%3E%3Ctext%20x%3D%22600%22%20y%3D%22210%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3EClass%3A%206%3C/text%3E%3Ctext%20x%3D%22600%22%20y%3D%22245%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3ESet%3A%20A%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22305%22%20font-family%3D%22Arial%22%20font-size%3D%2221%22%20font-weight%3D%22700%22%20fill%3D%22%230b2d4d%22%3EEvaluated%20Answer%20Sheet%20%E2%80%94%20Page%201%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22360%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3EQ1%E2%80%93Q3%3A%20Correct%20method%20and%20final%20answers%20shown.%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22415%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3EQ4%3A%20Method%20mostly%20correct%3B%20review%20calculation%20steps.%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22470%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3EQ5%E2%80%93Q7%3A%20Work%20shown%20with%20intermediate%20steps.%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22525%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%3EQ8%3A%20Long-answer%20working%20shown%3B%20review%20final%20steps.%3C/text%3E%3Cline%20x1%3D%2260%22%20y1%3D%22580%22%20x2%3D%22840%22%20y2%3D%22580%22%20stroke%3D%22%23d7e1e9%22%20stroke-width%3D%222%22/%3E%3Ctext%20x%3D%2260%22%20y%3D%22630%22%20font-family%3D%22Arial%22%20font-size%3D%2218%22%20font-weight%3D%22700%22%3EEvaluator%27s%20note%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%22670%22%20font-family%3D%22Arial%22%20font-size%3D%2217%22%3EGood%20understanding%20of%20the%20chapter.%20Review%20the%20steps%20in%20Q4%20and%20Q8.%3C/text%3E%3Ctext%20x%3D%2260%22%20y%3D%221090%22%20font-family%3D%22Arial%22%20font-size%3D%2215%22%20fill%3D%22%2364748b%22%3ECWP%202026%20local%20demonstration%20answer-sheet%20page.%3C/text%3E%3C/svg%3E',name:'Aditi_Page_1.svg'}]
};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function calc(q=[]){let total=0,max=0;q.forEach(x=>{max+=Number(x[1]||0);total+=Number(x[2]||0)});return{total,max,pct:max?total/max*100:0}}
function load(){ return onlineRecords.length ? onlineRecords : [demo]; }
function save(a){ onlineRecords = a; }
function toast(text,type='success'){const e=document.getElementById('toast');if(e){e.className='msg show '+type;e.textContent=text;setTimeout(()=>e.className='msg',3500)}}
function shell(content,active='student'){return `<header class="top"><div class="brand"><div class="logo">CWP</div><div><div class="brand-title">CHILDREN WELFARE PROGRAMME 2026</div><div class="brand-sub">ANSWER SHEET & MARKS PORTAL</div></div></div><nav><button class="${active==='student'?'active':''}" onclick="go('student')">Student Result</button><button class="${active==='admin'?'active':''}" onclick="go('admin')">Admin</button></nav></header><div id="toast" class="msg"></div>${content}<footer><strong>Children Welfare Programme 2026</strong><span>Organiser: Anshuman Singh · Programme Incharge: Pooja Yadav</span><span>Examination Controller: Parchi Yadav · Evaluator: Anshika Singh</span></footer>`}
function home(){document.getElementById('app').innerHTML=shell(`<main><section class="hero"><div class="hero-copy"><div class="eyebrow">OFFICIAL EXAMINATION RECORDS</div><h1>View your marks and evaluated answer sheet.</h1><p>Enter the Student ID and Paper Code exactly as issued. Only the matching record is returned.</p></div><section class="card search-card"><h2>Result Search</h2><p class="muted">Both fields are required.</p><label>Student ID<input id="sid" placeholder="CWP26-MID-014" autocomplete="off"></label><br><label>Paper Code<input id="pcode" placeholder="6MA01A" autocomplete="off"></label><button class="btn primary full" onclick="lookup()">VIEW ANSWER SHEET & MARKS</button><div id="msg" class="msg"></div><p class="small muted">Demo: CWP26-MID-014 + 6MA01A</p></section></section><div id="result"></div></main>`,'student')}
function renderPage(p){let u=p.data||'';return p.type==='application/pdf'?`<iframe src="${u}"></iframe>`:`<img src="${u}" alt="Answer sheet page ${esc(p.page)}">`}
function result(r){const c=calc(r.question_marks),pages=r.answer_sheets||[];return `<section class="card result" id="resultCard"><div class="result-head"><div><div class="eyebrow">OFFICIAL EXAMINATION RESULT</div><h2>STUDENT ANSWER SHEET & MARKS</h2><strong>${esc(r.student_name)}</strong><div class="muted">Student ID: ${esc(r.student_id)}</div></div><span class="badge">${esc(r.paper_code)}</span></div><div class="meta">${[['Class',r.class],['Set',r.set],['Subject',r.subject],['Chapter / Test',(r.chapter||'')+' · '+(r.test||'')],['Examination Date',r.date],['Shift',r.shift],['Paper Code',r.paper_code],['Maximum Marks',r.maximum_marks||c.max]].map(x=>`<div><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div><div class="result-grid"><section class="card panel"><h3>MARKS AWARDED</h3><table><thead><tr><th>Question</th><th>Maximum</th><th>Awarded</th></tr></thead><tbody>${(r.question_marks||[]).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td><b>${esc(x[2])}</b></td></tr>`).join('')}</tbody></table><div class="total-box"><div><small>Total Marks</small><b>${c.total}/${c.max}</b></div><div><small>Percentage</small><b>${c.pct.toFixed(2)}%</b></div><div><small>Evaluator</small><b>Anshika Singh</b></div></div><div class="remarks"><b>Evaluator's Remarks</b><p>${esc(r.remarks||'No remarks added.')}</p></div></section><section class="card panel"><h3>STUDENT ANSWER SHEET</h3><div class="sheet"><div id="sheetPage" class="page">${pages.length?renderPage(pages[0]):'<div class="sheet-empty"><b>Answer sheet not uploaded yet.</b><span>The result is available, but scanned pages have not been attached.</span></div>'}</div>${pages.length?`<div class="pager"><button id="prev" class="btn secondary">Previous</button><span id="pageNo">Page 1 / ${pages.length}</span><button id="next" class="btn secondary">Next</button></div>`:''}</div></section></div><div class="actions no-print"><button class="btn primary" onclick="window.print()">PRINT RESULT</button><button class="btn secondary" onclick="home()">NEW SEARCH</button></div></section>`}
async function lookup(){let sid=document.getElementById('sid').value.trim().toUpperCase(),code=document.getElementById('pcode').value.trim().toUpperCase(),m=document.getElementById('msg');m.className='msg';if(!sid||!code){m.textContent='Please enter Student ID and Paper Code.';m.className='msg show error';return}let r=null;
try{
  if(CWP_V2.apiBase){
    r=await CWP_V2.getResult(sid,code);
  }else{
    r=load().find(x=>x.student_id.toUpperCase()===sid&&x.paper_code.toUpperCase()===code);
  }
}catch(err){
  m.textContent='Online result service is temporarily unavailable.';
  m.className='msg show error';
  return;
}
if(!r){m.textContent='No answer sheet found for this Student ID and Paper Code.';m.className='msg show error';return}
m.textContent=CWP_V2.apiBase?'Online result found.':'Demo result found (local mode).';m.className='msg show success';document.getElementById('result').innerHTML=result(r);bindPages(r)}
function bindPages(r){let pages=r.answer_sheets||[],i=0;if(!pages.length)return;const upd=()=>{document.getElementById('sheetPage').innerHTML=renderPage(pages[i]);document.getElementById('pageNo').textContent=`Page ${i+1} / ${pages.length}`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===pages.length-1};document.getElementById('prev').onclick=()=>{if(i){i--;upd()}};document.getElementById('next').onclick=()=>{if(i<pages.length-1){i++;upd()}}}
function adminLogin(){
  document.getElementById('app').innerHTML=shell(`<main class="admin-wrap"><section class="card">
  <div class="eyebrow">ONLINE ADMINISTRATOR</div><h1>Admin Login</h1>
  <div class="notice"><b>Online mode:</b> administrator access uses Supabase Authentication. Create the admin account in Supabase first.</div>
  <label>Email<input id="ae" value="${esc(ADMIN_EMAIL)}" placeholder="Admin email"></label><br>
  <label>Password<input id="ap" type="password" placeholder="Supabase Auth password"></label>
  <button class="btn primary full" onclick="adminAuth()">SIGN IN</button>
  <div id="am" class="msg"></div>
  <p class="small muted">Student result lookup does not require an account.</p>
  </section></main>`,'admin');
}
async function adminAuth(){
  const email=document.getElementById('ae').value.trim();
  const password=document.getElementById('ap').value;
  const m=document.getElementById('am');
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.msg||data.error_description||'Login failed.');
    if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()) throw new Error('This account is not the configured CWP administrator.');
    currentAdminToken=data.access_token;
    localStorage.setItem('cwp_admin_token',currentAdminToken);
    await adminDash();
  }catch(err){
    m.textContent=err.message||'Incorrect admin email or password.';
    m.className='msg show error';
  }
}
async function adminDash(){
  if(!currentAdminToken) currentAdminToken=localStorage.getItem('cwp_admin_token');
  if(!currentAdminToken){adminLogin();return}
  try{
    onlineRecords=await CWP_ONLINE.listResults(currentAdminToken);
  }catch(err){
    localStorage.removeItem('cwp_admin_token'); currentAdminToken=null; adminLogin(); return;
  }
  let rs=onlineRecords;document.getElementById('app').innerHTML=shell(`<main><div class="admin-bar"><div><div class="eyebrow">ADMIN PANEL</div><h1>Manage Examination Records</h1><p class="muted">Add/edit students, marks, remarks and answer-sheet pages.</p></div><button class="btn secondary" onclick="logout()">SIGN OUT</button></div><section class="admin-grid"><section class="card"><h2>Record Editor</h2><form id="form" onsubmit="event.preventDefault();saveRecord()"><div class="form-grid"><label>Student ID<input id="f_sid" required></label><label>Student Name<input id="f_name" required></label><label>Class<input id="f_class" required></label><label>Set<select id="f_set"><option>A</option><option>B</option><option>C</option></select></label><label>Paper Code<input id="f_code" required></label><label>Subject<input id="f_subject" required></label><label>Chapter<input id="f_chapter" required></label><label>Test<input id="f_test" required></label><label>Exam Date<input id="f_date" required placeholder="16/09/2026"></label><label>Shift<input id="f_shift" required></label><label>Maximum Marks<input id="f_max" type="number" value="100" required></label></div><h3 style="margin-top:22px">Question-wise Marks</h3><div class="qrow"><b>Question</b><b>Maximum</b><b>Awarded</b></div><div id="qbody"></div><label style="margin-top:15px">Evaluator Remarks<textarea id="f_remarks"></textarea></label><label style="margin-top:15px">Answer Sheet Pages (JPG, PNG or PDF)<input id="f_files" type="file" accept="image/*,application/pdf" multiple></label><p class="small muted">New uploads replace the answer-sheet pages for this Student ID + Paper Code.</p><div class="actions"><button class="btn primary" type="submit">SAVE RECORD</button><button class="btn secondary" type="button" onclick="clearForm()">CLEAR</button></div></form></section><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2>Records</h2><p class="muted">Search, edit, preview or delete records stored on this device.</p></div><input id="rs" placeholder="Search ID, name or paper" oninput="renderRecords()"></div><div id="records"></div></section></section></main>`,'admin');renderQs();renderRecords()}
function renderQs(q){q=q||Array.from({length:8},(_,i)=>['Q'+(i+1),[5,5,5,10,10,15,20,30][i],0]);document.getElementById('qbody').innerHTML=q.map(x=>`<div class="qrow"><input class="qn" value="${esc(x[0])}"><input class="qm" type="number" min="0" value="${x[1]}"><input class="qa" type="number" min="0" value="${x[2]}"></div>`).join('')}
function clearForm(){document.getElementById('form').reset();document.getElementById('f_max').value=100;renderQs()}
async function saveRecord(){
  let sid=document.getElementById('f_sid').value.trim().toUpperCase(),
      code=document.getElementById('f_code').value.trim().toUpperCase();
  let q=[...document.querySelectorAll('#qbody .qrow')].map(row=>[
    row.querySelector('.qn').value.trim(),
    +row.querySelector('.qm').value||0,
    +row.querySelector('.qa').value||0
  ]);
  if(q.some(x=>x[2]>x[1])){alert('Awarded marks cannot exceed maximum marks.');return}
  let old=onlineRecords.find(x=>x.student_id===sid&&x.paper_code===code);
  let rec={
    student_id:sid,
    student_name:document.getElementById('f_name').value.trim(),
    class:document.getElementById('f_class').value.trim(),
    set:document.getElementById('f_set').value,
    paper_code:code,
    subject:document.getElementById('f_subject').value.trim(),
    chapter:document.getElementById('f_chapter').value.trim(),
    test:document.getElementById('f_test').value.trim(),
    date:document.getElementById('f_date').value.trim(),
    shift:document.getElementById('f_shift').value.trim(),
    maximum_marks:+document.getElementById('f_max').value||100,
    question_marks:q,
    remarks:document.getElementById('f_remarks').value.trim(),
    answer_sheets:old?.answer_sheets||[]
  };
  const files=[...document.getElementById('f_files').files];
  if(files.length){
    rec.answer_sheets=[];
    let left=files.length;
    files.forEach((file,i)=>{
      let fr=new FileReader();
      fr.onload=async()=>{
        rec.answer_sheets[i]={page:i+1,type:file.type,data:fr.result,name:file.name};
        if(--left===0) await upsert(rec);
      };
      fr.readAsDataURL(file);
    });
    return;
  }
  await upsert(rec);
}
async function upsert(rec){
  try{
    await CWP_ONLINE.upsertResult(rec,currentAdminToken);
    onlineRecords=await CWP_ONLINE.listResults(currentAdminToken);
    toast('Record saved online successfully.');
    clearForm();
    renderRecords();
  }catch(err){
    alert('Online save failed. Check that the Supabase SQL setup and admin account are completed.');
    console.error(err);
  }
}
async function editRecord(sid,code){
  let r=onlineRecords.find(x=>x.student_id===sid&&x.paper_code===code);
  if(!r)return;
  for(let [id,v] of [['f_sid',r.student_id],['f_name',r.student_name],['f_class',r.class],['f_code',r.paper_code],['f_subject',r.subject],['f_chapter',r.chapter],['f_test',r.test],['f_date',r.date],['f_shift',r.shift],['f_max',r.maximum_marks],['f_remarks',r.remarks]])
    document.getElementById(id).value=v||'';
  document.getElementById('f_set').value=r.set||'A';
  renderQs(r.question_marks);
  document.getElementById('form').scrollIntoView({behavior:'smooth'});
}
async function deleteRecord(sid,code){
  if(!confirm('Delete this online record and its answer-sheet pages?'))return;
  try{
    await CWP_ONLINE.deleteResult(sid,code,currentAdminToken);
    onlineRecords=await CWP_ONLINE.listResults(currentAdminToken);
    renderRecords();
    toast('Record deleted.');
  }catch(err){alert('Could not delete the online record.');console.error(err)}
}
function previewRecord(sid,code){let r=load().find(x=>x.student_id===sid&&x.paper_code===code);if(!r)return;document.getElementById('app').innerHTML=shell(`<main>${result(r)}</main>`,'admin');bindPages(r)}
function renderRecords(){let term=(document.getElementById('rs')?.value||'').toLowerCase(),a=load().filter(x=>JSON.stringify(x).toLowerCase().includes(term));document.getElementById('records').innerHTML=a.map(r=>{let c=calc(r.question_marks);return `<div class="record"><div><b>${esc(r.student_name)}</b><span>${esc(r.student_id)} · ${esc(r.paper_code)} · ${esc(r.subject)}</span></div><strong>${c.total}/${c.max}</strong><div class="record-actions"><button class="btn secondary" onclick="editRecord('${esc(r.student_id)}','${esc(r.paper_code)}')">EDIT</button><button class="btn secondary" onclick="previewRecord('${esc(r.student_id)}','${esc(r.paper_code)}')">PREVIEW</button><button class="btn danger" onclick="deleteRecord('${esc(r.student_id)}','${esc(r.paper_code)}')">DELETE</button></div></div>`}).join('')||'<p class="muted">No records found.</p>'}
function logout(){
  localStorage.removeItem('cwp_admin_token');
  currentAdminToken=null;
  adminLogin();
}
function go(where){if(where==='admin')adminLogin();else home()}
home();
</script>
</body>
</html>
